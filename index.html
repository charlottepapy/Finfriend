<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f2ff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finfriend">
<title>Finfriend</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ff;--card:#fff;--ink:#1e1846;--mute:#7c7799;--line:#ece8f8;
  --brand:#6c4cf5;--brand2:#9a7bff;--brandsoft:#efeaff;
  --ok:#22c79a;--mid:#ffc53d;--warn:#ff8a4c;--over:#ff5c8a;
  --violet:#6c4cf5;--violetsoft:#efeaff;--pink:#ff6fa3;
  --r:24px;--shadow:0 8px 24px rgba(76,52,180,.08);
  --disp:'Outfit',Inter,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#e9e3ff;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:inherit}
.device{width:390px;height:844px;max-height:96vh;background:var(--bg);border-radius:46px;border:10px solid #17122f;position:relative;overflow:hidden;box-shadow:0 30px 70px rgba(60,40,140,.25)}
@media(max-width:520px){body{background:var(--bg)}.device{width:100vw;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none}}
#screen{position:absolute;inset:0;overflow-y:auto;padding:22px 18px 130px;scrollbar-width:none}
#screen::-webkit-scrollbar{display:none}
.num{font-family:var(--disp);font-variant-numeric:tabular-nums}
h1{font-family:var(--disp);font-size:28px;letter-spacing:-.02em;font-weight:700}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.mute{color:var(--mute);font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.head .hello{font-size:13px;color:var(--mute);font-weight:500}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--brand)}
.iconbtn svg{width:19px;height:19px}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin-top:14px;box-shadow:var(--shadow)}
.card-title{font-family:var(--disp);font-size:17px;font-weight:700}
.sect{margin:24px 2px 10px;font-family:var(--disp);font-size:17px;font-weight:700}

/* mascot */
.mascot{flex:none;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}

/* hero */
.hero{border-radius:30px;padding:20px 20px 18px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;position:relative;overflow:hidden;cursor:pointer;user-select:none;box-shadow:0 18px 30px -16px var(--g2);transition:background .5s}
.hero::before,.hero::after,.balcard::before,.balcard::after{content:'';position:absolute;border-radius:50%;filter:blur(26px);pointer-events:none}
.hero::before{width:180px;height:180px;right:-60px;top:-70px;background:rgba(255,255,255,.45)}
.hero::after{width:150px;height:150px;left:-50px;bottom:-80px;background:var(--g3);opacity:.7}
.hero>*{position:relative}
.hero .top{display:flex;justify-content:space-between;align-items:center}
.hero .eyebrow{color:rgba(255,255,255,.85)}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.25);border-radius:99px;padding:6px 11px;font-size:12px;font-weight:600;color:#fff}
.pill svg{width:14px;height:14px}
.hero .main{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px}
.hero .main>div{min-width:0}
.hero .word{font-family:var(--disp);font-size:34px;line-height:1.02;font-weight:700;letter-spacing:-.03em}
.hero .sub{font-size:13px;margin-top:8px;max-width:200px;color:rgba(255,255,255,.92)}
.hero .meterbar{height:8px;background:rgba(255,255,255,.3);border-radius:9px;margin-top:16px;overflow:hidden}
.hero .meterbar i{display:block;height:100%;background:#fff;border-radius:9px;transition:width .7s}
.hero .count{height:3px;background:rgba(255,255,255,.35);border-radius:9px;margin-top:10px;overflow:hidden}
.hero .count i{display:block;height:100%;background:#fff;animation:shrink 5s linear forwards;transform-origin:left}
@keyframes shrink{from{width:100%}to{width:0}}

/* balance card + tiles (activity) */
.balcard{border-radius:28px;padding:20px;background:linear-gradient(135deg,#9a7bff,#6c4cf5 60%,#5137d8);color:#fff;position:relative;overflow:hidden;box-shadow:0 18px 30px -16px #6c4cf5}
.balcard::before{width:170px;height:170px;right:-50px;top:-60px;background:#ff8fc0;opacity:.75}
.balcard::after{width:130px;height:130px;right:60px;bottom:-90px;background:#ffd23f;opacity:.55}
.balcard>*{position:relative}
.balcard .lbl{font-size:13px;opacity:.85;font-weight:500}
.balcard .big{font-family:var(--disp);font-size:40px;font-weight:700;letter-spacing:-.03em;margin-top:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{border-radius:22px;padding:14px 15px;background:var(--tc)}
.tile .lbl{font-size:12px;font-weight:600;color:rgba(30,24,70,.65)}
.tile b{display:block;font-family:var(--disp);font-size:22px;letter-spacing:-.02em;margin-top:4px}
.tile .em{font-size:20px}
.donut{display:grid;place-items:center;position:relative;margin:8px 0 6px}
.donut .mid{position:absolute;text-align:center}
.donut .mid b{display:block;font-family:var(--disp);font-size:28px;font-weight:700;letter-spacing:-.02em}
.donut .mid span{font-size:12px;color:var(--mute);font-weight:600}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-top:8px}
.legend div{display:flex;align-items:center;gap:7px;font-size:13px;padding:4px 0;min-width:0}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.legend span{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend b{font-weight:700;font-family:var(--disp)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border-radius:99px;padding:10px 14px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;box-shadow:var(--shadow)}
.chip:active{transform:scale(.97)}
.chip.cc{background:color-mix(in srgb,var(--c) 24%,#fff);box-shadow:none}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,#bbb);flex:none}
.chip.out{background:transparent;box-shadow:none;border:1.5px dashed #cdc3f5;color:var(--brand)}
.chip.on{background:var(--brand);color:#fff}
.btn{width:100%;border-radius:18px;padding:16px;font-weight:700;font-size:15px;background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;box-shadow:0 12px 22px -10px rgba(108,76,245,.7)}
.btn:disabled{opacity:.35;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.soft{background:var(--brandsoft);color:var(--brand);box-shadow:none}
.btn.danger{background:transparent;color:#d6336c;border:1.5px solid #ffc9da;box-shadow:none}
.btn.sm{width:auto;padding:9px 14px;font-size:13px;border-radius:12px}
.vcard{width:100%;margin-top:14px;border-radius:var(--r);padding:16px 18px;background:linear-gradient(135deg,#ff7eb3,#8b6cff);color:#fff;display:flex;justify-content:space-between;align-items:center;text-align:left;box-shadow:0 16px 26px -14px #8b6cff}
.vcard b{font-family:var(--disp);font-size:17px}
.vcard small{display:block;opacity:.9;font-size:12px;margin-top:2px;font-weight:500}
.tagv{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.25);padding:4px 8px;border-radius:99px}
.tagv.dark{background:var(--violetsoft);color:var(--violet)}
.soft-alert{border-radius:18px;padding:13px 15px;font-size:13px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff1c2;color:#6b4d0d}
.soft-alert.info{background:#e9e3ff;color:#3b2a8f}
.soft-alert button{font-weight:700;font-size:13px;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{text-align:left;border-radius:18px;padding:12px;background:var(--tc,var(--bg))}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.stat span{font-size:11px;color:var(--mute);line-height:1.2;display:block;margin-top:2px}
.dots{display:flex;justify-content:space-between;margin-top:14px}
.dot{text-align:center;font-size:10px;color:var(--mute);font-weight:600}
.dot i{display:block;width:32px;height:32px;border-radius:50%;margin:0 auto 5px;background:var(--line)}
.dot.today i{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--brand)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ff7eb3,var(--brand));transition:width .6s}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item .dotc{width:42px;height:42px;border-radius:14px;background:color-mix(in srgb,var(--c) 24%,#fff);display:grid;place-items:center;font-size:20px;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t span{font-size:12px;color:var(--mute)}
.item .amt{font-weight:600;font-size:15px}
.x{width:30px;height:30px;border-radius:9px;color:var(--mute);display:grid;place-items:center;font-size:18px}
.day{font-size:12px;font-weight:700;color:var(--mute);margin:18px 4px 2px;text-transform:uppercase;letter-spacing:.06em}
.catbar{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:13px}
.catbar .n{width:76px;font-weight:600}
.catbar .b{flex:1;height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.catbar .b i{display:block;height:100%;background:var(--c);border-radius:9px}
.catbar .v{width:56px;text-align:right;font-weight:600}
.tintcard{background:linear-gradient(135deg,#ffe9a8,#ffd1e3)!important;color:#5b3a12}
.tintcard .mute{color:#7a5320}
.goalcard{background:linear-gradient(135deg,#ffe3ef,#e9e3ff)}
.goalcard .main{display:flex;justify-content:space-between;align-items:center;gap:8px}
.locked{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);opacity:.8}
.locked:last-child{border:0}
.locked svg{width:18px;height:18px;color:var(--violet);flex:none}

/* tab bar */
#tabbar{position:absolute;left:14px;right:14px;bottom:14px;height:70px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-radius:28px;box-shadow:0 12px 30px rgba(60,40,140,.16);display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:center;z-index:3}
#tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:#a9a3c4}
#tabbar button.on{color:var(--brand)}
#tabbar svg{width:22px;height:22px}
#tabbar .fab{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#ff7eb3,var(--brand));color:#fff;margin:-34px auto 0;box-shadow:0 12px 24px -6px rgba(108,76,245,.6);justify-content:center;border:4px solid var(--bg)}
#tabbar .fab svg{width:28px;height:28px}
#tabbar .fab:active{transform:scale(.94)}

/* sheet */
#ovl{position:absolute;inset:0;background:rgba(30,24,70,.42);opacity:0;pointer-events:none;transition:.22s;z-index:8}
#ovl.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:30px 30px 0 0;padding:10px 18px 26px;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:9;max-height:94%;overflow-y:auto;scrollbar-width:none}
#sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:9px;background:#d9d2f3;margin:0 auto 14px}
.stitle{font-family:var(--disp);font-size:20px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px}
.kpamt{text-align:center;font-family:var(--disp);font-size:58px;font-weight:700;letter-spacing:-.03em;margin:6px 0 8px;color:var(--brand)}
.kpamt .z{opacity:.28}
.cats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 12px}
.cat{background:color-mix(in srgb,var(--c) 20%,#fff);border-radius:99px;padding:8px 13px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center;border:2px solid transparent}
.cat.on{background:var(--c);border-color:var(--ink)}
.note{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;font-size:14px;outline:none;margin-bottom:12px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pad button{background:var(--card);border-radius:18px;padding:14px 0;font-family:var(--disp);font-size:24px;font-weight:600;box-shadow:var(--shadow)}
.pad button:active{background:var(--brandsoft)}
.field{display:block;margin-top:14px}
.field span{display:block;font-size:12px;font-weight:600;color:var(--mute);margin-bottom:6px}
.field input{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:13px 14px;font-size:16px;outline:none}
.field input:focus,.note:focus{border-color:var(--brand)}
.bigin{font-family:var(--disp);font-size:34px!important;font-weight:700;letter-spacing:-.02em}
.verdict{border-radius:20px;padding:16px;margin-top:16px;transition:background .3s}
.verdict b{font-family:var(--disp);font-size:20px;letter-spacing:-.01em;display:block}
.verdict p{font-size:13px;margin-top:6px;color:rgba(30,24,70,.78)}
.verdict .meter{height:8px;border-radius:9px;background:rgba(255,255,255,.65);margin-top:12px;overflow:hidden}
.verdict .meter i{display:block;height:100%;background:var(--ink);border-radius:9px;transition:width .4s}
.v-idle{background:var(--violetsoft)}.v-ok{background:#d4f7ec}.v-mid{background:#fff1c2}.v-warn{background:#ffe1cf}.v-over{background:#ffd9e6}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);gap:14px}
.sw{width:46px;height:28px;border-radius:99px;background:#ddd6f3;position:relative;flex:none;transition:.2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--brand)}.sw.on::after{left:21px}
.menu{display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 0;border-bottom:1px solid var(--line);font-size:15px;font-weight:600;text-align:left}
#toast{position:absolute;left:16px;right:16px;bottom:100px;background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:500;z-index:12;transform:translateY(16px);opacity:0;pointer-events:none;transition:.25s}
#toast.on{transform:none;opacity:1;pointer-events:auto}
#toast button{color:#c9b8ff;font-weight:700;margin-left:12px}

/* onboarding */
.ob{padding-top:26px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:700;font-size:19px;margin-bottom:22px}
.logo i{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#ff7eb3,var(--brand));display:grid;place-items:center;color:#fff;font-style:normal;font-weight:700}
.obart{position:relative;height:170px;display:grid;place-items:center;margin-bottom:10px}
.obart::before{content:'';position:absolute;width:200px;height:160px;border-radius:46% 54% 60% 40%/50% 45% 55% 50%;background:var(--splash)}
.obart .mascot{position:relative}
.ob h1{font-size:32px;line-height:1.08;margin-bottom:10px}
.ob .lead{color:var(--mute);font-size:15px;margin-bottom:22px}
.ob .moneyin{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:20px;padding:12px 16px;box-shadow:var(--shadow)}
.ob .moneyin span{font-size:30px;font-family:var(--disp);font-weight:700;color:var(--brand2)}
.ob .moneyin input{border:0;outline:0;font-size:34px;font-family:var(--disp);font-weight:700;width:100%;background:transparent}
.ob .lab{font-size:13px;font-weight:600;margin:20px 2px 8px}
.obsteps{display:flex;gap:6px;margin-bottom:18px}
.obsteps i{height:5px;flex:1;border-radius:9px;background:#e1daf7}
.obsteps i.on{background:linear-gradient(90deg,#ff7eb3,var(--brand))}
.obback{font-size:13px;font-weight:600;color:var(--mute);margin-bottom:6px}
.link{display:block;text-align:center;margin-top:16px;font-size:13px;font-weight:600;color:var(--brand);width:100%}

/* phone / installed app */
@media(display-mode:standalone){body{background:var(--bg)}.device{width:100vw;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none}}
#screen{padding-top:calc(22px + env(safe-area-inset-top))}
#tabbar{bottom:calc(14px + env(safe-area-inset-bottom))}
#sheet{padding-bottom:calc(26px + env(safe-area-inset-bottom))}
#toast{bottom:calc(100px + env(safe-area-inset-bottom))}
.sync{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:14px 0 6px}
.sync i{width:9px;height:9px;border-radius:50%;background:#c4bddb;display:inline-block}
.sync.ok i{background:var(--ok)}.sync.err i{background:var(--warn)}.sync.busy i{background:var(--mid)}
.accbox{border-radius:18px;background:var(--card);padding:14px;margin:6px 0 4px;box-shadow:var(--shadow)}
.accbox .field{margin-top:8px}
.accbox .btn{margin-top:10px;padding:12px}
#accMsg{font-size:13px;margin-top:10px;color:var(--mute);min-height:18px}
</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
</head>
<body>
<div class="device">
  <div id="screen"></div>
  <nav id="tabbar"></nav>
  <div id="ovl" data-act="close"></div>
  <div id="sheet"></div>
  <div id="toast"></div>
</div>

<script>
/* ============ helpers ============ */
const KEY='finfriend.v1';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dt=s=>new Date(s+'T12:00:00');
const TODAY=()=>ymd(new Date());
const addDays=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return ymd(d)};
const addMonth=s=>{const d=dt(s);d.setMonth(d.getMonth()+1);return ymd(d)};
const diffDays=(a,b)=>Math.round((dt(b)-dt(a))/864e5);
const usd=n=>{const c=Math.round(n*100);return '$'+(c/100).toLocaleString('en-US',{minimumFractionDigits:c%100===0?0:2,maximumFractionDigits:2})};
const fmtDate=s=>dt(s).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const dayLabel=s=>{const n=diffDays(TODAY(),s);return n===0?'Today':n===-1?'Yesterday':fmtDate(s)};
const ord=n=>n>=31?'Last day':n+(n%10===1&&n!==11?'st':n%10===2&&n!==12?'nd':n%10===3&&n!==13?'rd':'th');
function nextPayDate(day){ // next time this day of the month comes round, after today
  const t=dt(TODAY());
  for(let k=0;;k++){const y=t.getFullYear(),m=t.getMonth()+k;const d=ymd(new Date(y,m,Math.min(day,new Date(y,m+1,0).getDate()),12));if(d>TODAY())return d}
}
const relDue=s=>{const n=diffDays(TODAY(),s);return n<0?'Overdue':n===0?'Due today':n===1?'Due tomorrow':'Due in '+n+' days'};
const CATS=[{n:'Food',c:'#ff9f43',e:'\u{1F354}'},{n:'Transport',c:'#4dabff',e:'\u{1F68C}'},{n:'Fun',c:'#b06bff',e:'\u{1F389}'},{n:'Study',c:'#1fc8a0',e:'\u{1F4DA}'},{n:'Shopping',c:'#ff6fa3',e:'\u{1F6CD}️'},{n:'Other',c:'#ffd23f',e:'✨'}];

/* ============ calculations ============ */
function spentOn(d){return S.expenses.filter(e=>e.date===d).reduce((a,e)=>a+e.amount,0)}
function calc(){
  const t=TODAY();
  const daysLeft=Math.max(1,diffDays(t,S.nextIncome));
  const billsUp=S.bills.filter(b=>b.due<=S.nextIncome).reduce((a,b)=>a+b.amount,0);
  const reserve=S.goal?Math.max(0,S.goal.perPeriod-(S.goal.setAside||0)):0;
  const avail=S.dayStart.balance-billsUp-reserve;
  const base=avail/daysLeft;
  const spent=spentOn(t);
  const room=base-spent;
  const ratio=base>0?room/base:(room<0?-1:0);
  return {daysLeft,billsUp,reserve,avail,base,spent,room,ratio};
}
function status(c){
  // g1/g2: card gradient, g3: glow, m: mascot colours, mood: mascot face
  if(c.base<=0)return{word:'Stretched',msg:'Fixed costs and goals take most of this period. Essentials first.',g:['#ff9a62','#e8494f','#ffd23f'],m:['#d4f7ec','#3ee0b0'],mood:'worried'};
  const r=c.ratio;
  if(r>.5)return{word:'Comfortable',msg:'You have room today. Spend normally.',g:['#27c99a','#0c9488','#ffe066'],m:['#fff3a3','#ffc83d'],mood:'happy'};
  if(r>.15)return{word:'Steady',msg:'You are on pace. Keep it steady.',g:['#a58bff','#6c4cf5','#ff8fc0'],m:['#ffd0e4','#ff7eb3'],mood:'calm'};
  if(r>=0)return{word:'Tight',msg:'Today\u2019s room is nearly used. Small choices only.',g:['#ffa040','#ef5f2b','#ffe066'],m:['#cfe8ff','#5aa9ff'],mood:'meh'};
  return{word:'Past pace',msg:'A little past today\u2019s pace. Tomorrow rebalances on its own.',g:['#ff8fb8','#f0477f','#a58bff'],m:['#e3d9ff','#9a7bff'],mood:'worried'};
}
const bucket=h=>h>=5&&h<11?0:h>=11&&h<15?1:h>=15&&h<19?2:3;
function suggestCat(){
  const b=bucket(new Date().getHours()),n={};
  S.expenses.forEach(e=>{if(bucket(e.h)===b)n[e.cat]=(n[e.cat]||0)+1});
  const best=Object.entries(n).sort((a,b)=>b[1]-a[1])[0];
  return best?best[0]:'Food';
}
function recents(){
  const cut=addDays(TODAY(),-30),m={};
  S.expenses.filter(e=>e.date>=cut).forEach(e=>{const k=e.name+'|'+e.cat+'|'+e.amount;m[k]=m[k]||{name:e.name,cat:e.cat,amount:e.amount,n:0};m[k].n++});
  return Object.values(m).sort((a,b)=>b.n-a.n).slice(0,4);
}
function weekRecap(){
  const t=TODAY(),days=[];
  for(let i=1;i<=7;i++){const d=addDays(t,-i);if(S.days[d])days.push({d,base:S.days[d].base,spent:spentOn(d)});}
  const exp=S.expenses.filter(e=>e.date>=addDays(t,-7));
  const byCat={};exp.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+e.amount);
  const top=Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0];
  return {days,within:days.filter(x=>x.spent<=x.base).length,total:exp.reduce((a,e)=>a+e.amount,0),top,byCat};
}
function firstDay(){ // older saves have no startDate: use the earliest day we know about
  return [...S.checkins,...S.expenses.map(e=>e.date)].sort()[0]||TODAY();
}
function stamp(){ // keep today's base on record
  const t=TODAY();
  if(!S.startDate)S.startDate=firstDay();
  if(!S.dayStart||S.dayStart.date!==t){S.dayStart={date:t,balance:S.balance};}
  S.days[t]={base:calc().base};
  if(!S.checkins.includes(t))S.checkins.push(t);
}

/* ============ mutations with undo ============ */
function mutate(fn,msg,undo=true){
  const snap=JSON.stringify(S);
  fn();stamp();persist();render();
  if(msg)toast(msg,undo?snap:null);
}
function toast(msg,snap){
  const el=$('#toast');
  el.innerHTML='<span>'+msg+'</span>'+(snap?'<button data-act="undo">Undo</button>':'');
  el._snap=snap;el.classList.add('on');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),4500);
}
function logExpense(name,cat,amount){
  mutate(()=>{
    S.expenses.push({id:uid(),name,cat,amount,date:TODAY(),h:new Date().getHours()});
    S.balance-=amount;
  },'Logged '+usd(amount)+' · '+esc(cat));
}

  $('#tabbar').innerHTML=tabs.map(t=>t[0]==='add'
    ?`<button class="fab" data-act="add" aria-label="Add expense">${IC.plus}</button>`
    :`<button class="${TAB===t[0]?'on':''}" data-act="tab" data-v="${t[0]}">${IC[t[2]]}${t[1]}</button>`).join('');
}

function alerts(c){
  const out=[],t=TODAY();
  if(S.nextIncome<=t)out.push(`<div class="soft-alert info"><span><b>Has your money arrived?</b> Update your balance to start a fresh period.</span><button data-act="money">Update</button></div>`);
  const soon=S.bills.filter(b=>diffDays(t,b.due)<=3).sort((a,b)=>a.due<b.due?-1:1)[0];
  if(soon)out.push(`<div class="soft-alert info"><span><b>${esc(soon.name)}</b> ${relDue(soon.due).toLowerCase()}. It is already set aside in your room.</span><button data-act="tab" data-v="bill">View</button></div>`);
  if(c.base>0&&c.ratio>=0&&c.ratio<.3)out.push(`<div class="soft-alert"><span><b>Heads up.</b> Today\u2019s pace is a little quick. Nothing to fix tonight, tomorrow adjusts by itself.</span></div>`);
  return out.slice(0,2).join('');

function setupCard(){

function overview(){
  const by={};S.expenses.forEach(e=>by[e.cat]=(by[e.cat]||0)+e.amount);
  const parts=Object.entries(by).filter(p=>p[1]>0).sort((a,b)=>b[1]-a[1]);
  const tot=parts.reduce((a,p)=>a+p[1],0);
  const since=dt(S.startDate||firstDay()).toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const top=parts[0];
  return `<div class="balcard"><div class="lbl">Balance now</div><div class="big num">${usd(S.balance)}</div></div>
  <div class="tiles">
    <div class="tile" style="--tc:#ffe3ef"><div class="lbl">Spent since ${since}</div><b class="num">${usd(tot)}</b></div>
    <div class="tile" style="--tc:#fff1c2"><div class="lbl">Biggest category</div><b>${top?`<span class="em">${catEmoji(top[0])}</span> ${top[0]}`:'-'}</b></div>
  </div>
  <div class="card"><span class="card-title">Where it went</span>
    ${parts.length?`<div class="donut">${donutSVG(parts,tot)}<div class="mid"><b class="num">${usd(tot)}</b><span>spent</span></div></div>
    <div class="legend">${parts.map(([n,v])=>`<div style="--c:${catColor(n)}"><i></i><span>${n}</span><b>${Math.round(v/tot*100)}%</b></div>`).join('')}</div>`
    :'<div class="mute" style="margin-top:8px">Log an expense and your breakdown appears here.</div>'}
  </div>`;
}
function donutSVG(parts,tot){ // rounded, separated segments
  const R=80,W=24,L=2*Math.PI*R,gap=W+8;
  if(parts.length===1)return `<svg width="210" height="210" viewBox="0 0 210 210"><circle cx="105" cy="105" r="${R}" fill="none" stroke="${catColor(parts[0][0])}" stroke-width="${W}"/></svg>`;
  let at=-90;
  return `<svg width="210" height="210" viewBox="0 0 210 210" role="img" aria-label="Spending by category">${parts.map(([n,v])=>{
    const len=Math.max(.01,v/tot*L-gap),rot=at+gap/2/L*360;at+=v/tot*360;
    return `<circle cx="105" cy="105" r="${R}" fill="none" stroke="${catColor(n)}" stroke-width="${W}" stroke-linecap="round" stroke-dasharray="${len.toFixed(2)} ${L.toFixed(2)}" transform="rotate(${rot.toFixed(2)} 105 105)"/>`}).join('')}</svg>`;
}

function bills(){

function verdictHTML(p){
  const c=calc();let cls='idle',title='Enter a price',body='Nothing is saved while you check.',meter=0;
  if(p>0){
    meter=c.base>0?Math.min(1,p/Math.max(c.room,.01)):1;
    if(c.base<=0){cls='warn';title='Better to wait';body='Fixed costs and goals come first this period.';meter=1}
    else if(p<=c.room){cls='ok';title='Fits comfortably';body='This stays within today\u2019s room.'}
    else{
      const d=Math.ceil((p-Math.max(c.room,0))/c.base);
      if(d<=2){cls='mid';title='Possible, with lighter days';body='It would borrow from about '+d+' day'+(d>1?'s':'')+' of upcoming room.'}
      else if(d<c.daysLeft){cls='warn';title='Better to wait';body='If you hold your spending, it would fit in about '+d+' days.'}
      else{cls='over';title='Not before your next income';body='It would strain the days ahead. A smaller option or a later date would fit.'}
    }
  }
  return `<div class="verdict v-${cls}"><b>${title}</b><p>${body}</p><div class="meter"><i style="width:${meter*100}%"></i></div></div>`;
}

/* ============ events ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,v=el.dataset.v;
  switch(a){
    case 'tab':TAB=v;$('#screen').scrollTop=0;render();break;
    case 'close':closeSheet();break;
    case 'reveal':
      if(S.showAmount)break;
      if(Date.now()<revealUntil){revealUntil=0;clearTimeout(revealTimer)}
      else{revealUntil=Date.now()+5000;clearTimeout(revealTimer);revealTimer=setTimeout(()=>{if(S&&TAB==='home')render()},5050)}
      render();break;
    case 'quick':logExpense(el.dataset.n,el.dataset.c,parseFloat(el.dataset.v));break;
    case 'add':KP={amt:'',cat:suggestCat(),note:''};openSheet('add');break;
    case 'kcat':KP.cat=v;paintSheet();break;
    case 'key':{
      let k=v,a2=KP.amt;
      if(k==='\u232b')a2=a2.slice(0,-1);
      else if(k==='.'){if(!a2.includes('.'))a2=(a2||'0')+'.'}
      else{const [i,d]=(a2+k).split('.');if((d===undefined&&i.length<=5)||(d!==undefined&&d.length<=2&&i.length<=5))a2+=k}
      KP.amt=a2.replace(/^0(?=\d)/,'');updateKp();break}
    case 'klog':{const n=parseFloat(KP.amt);if(n>0){const name=(KP.note||'').trim()||KP.cat;closeSheet();logExpense(name,KP.cat,n)}break}
    case 'afford':closeSheet();setTimeout(()=>openSheet('afford'),20);break;
    case 'afflog':{const n=parseFloat($('#affIn').value);if(n>0){KP={amt:String(n),cat:'Shopping',note:''};closeSheet();setTimeout(()=>{const nm=KP.cat;logExpense('Purchase',nm,n)},200)}break}
    case 'addbill':closeSheet();setTimeout(()=>openSheet('bill'),20);break;
    case 'billname':$('#bName').value=v;break;
    case 'savebill':{
      const name=$('#bName').value.trim(),amt=parseFloat($('#bAmt').value),due=$('#bDue').value;
      if(!name||!(amt>0)||!due){toast('Add a name, an amount and a date.',null);break}
      closeSheet();mutate(()=>S.bills.push({id:uid(),name,amount:amt,due}),'Bill added. Your room updated.');break}
    case 'paybill':{
      const b=S.bills.find(x=>x.id===v);if(!b)break;
      mutate(()=>{S.balance-=b.amount;S.dayStart.balance-=b.amount;b.due=addMonth(b.due)},esc(b.name)+' marked paid.');break}
    case 'goalform':closeSheet();setTimeout(()=>openSheet('goal'),20);break;
    case 'goalname':$('#gName').value=v;break;
    case 'gper':$('#gPer').value=v;break;
    case 'savegoal':{
      const name=$('#gName').value.trim(),target=parseFloat($('#gTarget').value),per=parseFloat($('#gPer').value)||0;
      if(!name||!(target>0)){toast('Add a goal name and a target.',null);break}
      closeSheet();mutate(()=>{S.goal={name,target,perPeriod:per,saved:S.goal?S.goal.saved:0,setAside:S.goal?S.goal.setAside:0}},'Goal saved.');break}
    case 'delgoal':closeSheet();mutate(()=>{S.goal=null},'Goal removed.');break;
    case 'setaside':{
      const n=parseFloat(v);if(!S.goal)break;
      mutate(()=>{S.goal.saved=Math.min(S.goal.target,S.goal.saved+n);S.goal.setAside=(S.goal.setAside||0)+n;S.balance-=n;S.dayStart.balance-=n},'Set aside '+usd(n)+'. Goal moves forward.');break}
    case 'delexp':{
      const x=S.expenses.find(q=>q.id===v);if(!x)break;
      mutate(()=>{S.expenses=S.expenses.filter(q=>q.id!==v);S.balance+=x.amount;if(x.date!==TODAY())S.dayStart.balance+=x.amount},'Removed '+esc(x.name)+'.');break}
    case 'dismisssetup':mutate(()=>{S.setupDismissed=true},null);break;
    case 'settings':openSheet('settings');break;
    case 'toggleamt':mutate(()=>{S.showAmount=!S.showAmount},null);paintSheet();break;
    case 'money':closeSheet();setTimeout(()=>openSheet('money'),20);break;
    case 'mchip':$('#mDate').value=addDays(TODAY(),parseInt(v));break;
    case 'savemoney':{
      const nb=parseFloat($('#mBal').value),nd=$('#mDate').value;
      if(isNaN(nb)||!nd){toast('Add a balance and a date.',null);break}
      closeSheet();
      mutate(()=>{
        const sp=spentOn(TODAY());
        if(S.nextIncome<=TODAY()&&S.goal)S.goal.setAside=0;
        S.balance=nb;S.dayStart={date:TODAY(),balance:nb+sp};S.nextIncome=nd;
      },'Balance updated.');break}
    case 'export':{const b=new Blob([JSON.stringify({app:'finfriend',version:1,exported:new Date().toISOString(),state:S},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='finfriend-backup-'+TODAY()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);break}
    case 'import':{const f=$('#impFile');if(f)f.click();break}
    case 'accsave':accountAction('upgrade');break;
    case 'accsignin':accountAction('signin');break;
    case 'demo':closeSheet();S=demo();OB=null;TAB='home';stamp();persist();render();toast('Sample data loaded.',null);break;
    case 'reset':
      if(el.dataset.sure){localStorage.removeItem(KEY);setMeta({updated:0,dirty:false});wipeRemote();S=null;OB=null;TAB='home';closeSheet();render()}
      else{el.dataset.sure='1';el.firstElementChild.textContent='Tap again to confirm';}
      break;
    case 'obnext':if(OB.step===1&&isNaN(obBalance()))break;OB.step++;renderOnboarding();break;
    case 'obback':OB.step=Math.max(1,OB.step-1);renderOnboarding();break;
    case 'obday':OB.day=parseInt(v);renderOnboarding();break;
    case 'obgname':OB.gName=v;renderOnboarding();break;
    case 'obgo':finishOnboarding(true);break;
    case 'obskip':finishOnboarding(false);break;
    case 'undo':{const sn=$('#toast')._snap;if(sn){S=JSON.parse(sn);persist();render();$('#toast').classList.remove('on')}break}
  }
});
document.addEventListener('input',e=>{

function updateKp(){

document.addEventListener('keydown',e=>{
  const typing=['INPUT','TEXTAREA'].includes(document.activeElement.tagName);
  if(e.key==='Escape'&&SHEET){closeSheet();return}
  if(SHEET==='add'&&!typing){
    if(/^[0-9.]$/.test(e.key))$(`.pad button[data-v="${e.key}"]`).click();

    else if(e.key==='Enter'){const b=$('#kpLog');if(b&&!b.disabled)b.click()}
  }else if(!typing&&!SHEET&&S&&(e.key==='n'||e.key==='+')){e.preventDefault();KP={amt:'',cat:suggestCat(),note:''};openSheet('add')}
});

document.addEventListener('change',e=>{
  if(e.target.id!=='impFile')return;
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const j=JSON.parse(r.result),st=j&&j.state?j.state:j;
    if(!st||typeof st.balance!=='number'||!st.nextIncome||!Array.isArray(st.expenses))throw new Error('bad');
    S=st;stamp();persist();closeSheet();TAB='home';render();toast('Backup restored.',null);
  }catch(err){toast('That file is not a Finfriend backup.',null)}};
  r.readAsText(f);
});

/* ============ sync (Supabase, offline-first) ============ */
const META='finfriend.meta';
function meta(){try{return JSON.parse(localStorage.getItem(META)||'{}')}catch(e){return {}}}
function setMeta(o){try{localStorage.setItem(META,JSON.stringify(Object.assign(meta(),o)))}catch(e){}}
const SYNC={sb:null,user:null,state:'off',err:'',busy:false,timer:null};
function setStatus(s,err){SYNC.state=s;SYNC.err=err||'';paintSync()}
function paintSync(){
  const el=$('#syncLine');if(!el)return;
  const m={ok:['ok','Backed up to your account'],busy:['busy','Syncing\u2026'],off:['','Saved on this device only'],offline:['','Offline, will sync when you are back online'],err:['err','Could not sync yet. Your data is safe on this device.']}[SYNC.state]||['',''];
  el.className='sync '+m[0];el.lastElementChild.textContent=m[1]+(SYNC.state==='err'&&SYNC.err?' ['+SYNC.err+']':'');
}
function accountHTML(){
  const u=SYNC.user;
  if(!SYNC.sb)return `<div class="accbox"><b style="font-size:14px">Account</b><div class="mute" style="margin-top:4px">Sync is unavailable right now.</div></div>`;
  if(u&&!u.is_anonymous)return `<div class="accbox"><b style="font-size:14px">Signed in</b><div class="mute" style="margin-top:4px">${esc(u.email||'')}</div></div>`;
  return `<div class="accbox"><b style="font-size:14px">Keep your progress safe</b>
    <div class="mute" style="margin-top:4px">You are using a guest account. Add your email so you never lose your data, or to open it on another device.</div>
    <label class="field"><span>Email</span><input id="accEmail" type="email" inputmode="email" autocomplete="email" placeholder="you@berkeley.edu"></label>
    <button class="btn" data-act="accsave">Save my progress</button>
    <button class="btn ghost" data-act="accsignin">I already have an account</button>
    <div id="accMsg"></div></div>`;
}
async function accountAction(kind){
  const msg=$('#accMsg'),em=($('#accEmail')||{}).value;
  const say=s=>{if(msg)msg.textContent=s};
  if(!em||!/^\S+@\S+\.\S+$/.test(em.trim()))return say('Enter a valid email first.');
  if(!SYNC.sb)return say('Sync is unavailable right now.');
  if(!navigator.onLine)return say('You are offline. Try again with a connection.');
  const redirect=location.origin+location.pathname;
  say('Sending\u2026');
  try{
    if(kind==='upgrade'){
      await ensureAuth();
      const {error}=await SYNC.sb.auth.updateUser({email:em.trim()},{emailRedirectTo:redirect});
      if(error)throw error;say('Check your inbox and tap the link to confirm.');
    }else{
      const {error}=await SYNC.sb.auth.signInWithOtp({email:em.trim(),options:{emailRedirectTo:redirect,shouldCreateUser:false}});
      if(error)throw error;say('Check your inbox and tap the sign-in link. It will restore your data here.');
    }
  }catch(e){say(e&&e.message?e.message:'Something went wrong.')}
}
async function ensureAuth(){
  if(SYNC.user)return SYNC.user;
  const {data:{session}}=await SYNC.sb.auth.getSession();
  if(session){SYNC.user=session.user;return SYNC.user}
  const {data,error}=await SYNC.sb.auth.signInAnonymously();
  if(error)throw error;
  SYNC.user=data.user;setMeta({uid:data.user.id});return SYNC.user;
}
function queuePush(){
  if(!SYNC.sb)return;
  clearTimeout(SYNC.timer);SYNC.timer=setTimeout(push,1500);
}
async function push(){
  if(!SYNC.sb||!S)return;
  if(!navigator.onLine)return setStatus('offline');
  if(SYNC.busy){queuePush();return}
  SYNC.busy=true;setStatus('busy');
  try{
    const u=await ensureAuth(),started=meta().updated||Date.now();
    const {error}=await SYNC.sb.from('app_state').upsert({user_id:u.id,state:S,client_updated:started,updated_at:new Date().toISOString()});
    if(error)throw error;
    if((meta().updated||0)===started)setMeta({dirty:false});
    setStatus('ok');
  }catch(e){setStatus('err',e&&e.message)}
  SYNC.busy=false;
}
async function pull(force){
  if(!SYNC.sb||!navigator.onLine)return;
  try{
    const {data:{session}}=await SYNC.sb.auth.getSession();
    if(!session){if(S)push();return}
    SYNC.user=session.user;
    if(meta().uid&&meta().uid!==session.user.id)force=true; // signed in as someone else: their data wins
    setMeta({uid:session.user.id});
    const {data,error}=await SYNC.sb.from('app_state').select('state,client_updated').eq('user_id',session.user.id).maybeSingle();
    if(error)throw error;
    const m=meta();
    if(data&&data.state&&(force||!S||data.client_updated>(m.updated||0))){
      S=data.state;
      try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
      setMeta({updated:data.client_updated,dirty:false});
      stamp();OB=null;
      if(SHEET)closeSheet();
      render();setStatus('ok');
    }else if(S&&(!data||m.dirty||(m.updated||0)>data.client_updated)){push()}
    else setStatus('ok');
  }catch(e){setStatus('err',e&&e.message)}
}
async function wipeRemote(){
  try{if(SYNC.sb&&SYNC.user&&navigator.onLine)await SYNC.sb.from('app_state').delete().eq('user_id',SYNC.user.id)}catch(e){}
}
function initSync(){
  const c=window.FF_CONFIG;
  if(!window.supabase||!c||!c.SUPABASE_URL){setStatus('err','sync library did not load, reload once while online');return}
  SYNC.sb=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  SYNC.sb.auth.onAuthStateChange((ev,session)=>{
    const uid=session&&session.user?session.user.id:null;
    SYNC.user=session?session.user:null;
    if(ev==='USER_UPDATED'&&SHEET==='settings')setTimeout(paintSheet,0);
  });
  pull();
  window.addEventListener('online',()=>pull());
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pull()});
}

/* ============ boot ============ */
if(S){stamp();persist()}
render();
if(S&&location.hash==='#add'){KP={amt:'',cat:suggestCat(),note:''};openSheet('add')}
window.addEventListener('load',()=>{
  initSync();
  if(!('serviceWorker' in navigator)||location.protocol==='file:')return;
  const hadSW=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadSW&&!reloaded&&!SHEET){reloaded=true;location.reload()}}); // a new version took over
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{})});
  }).catch(()=>{});
});
</script>
