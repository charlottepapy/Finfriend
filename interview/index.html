<style>
:root{--stage:#e9e3ff;--ink:#1e1846;--mute:#7c7799;--brand:#6c4cf5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--stage:#151129;--ink:#ece8ff;--mute:#a49fc2}}
:root[data-theme="dark"]{--stage:#151129;--ink:#ece8ff;--mute:#a49fc2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--stage);font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;overflow-x:hidden}
.device{position:relative;width:390px;height:844px;border-radius:48px;border:10px solid #17122f;overflow:hidden;box-shadow:0 30px 70px rgba(60,40,140,.25);background:#f5f2ff;flex:none;transform-origin:top center}
.screen{position:absolute;inset:0;display:none;opacity:0;transition:opacity .2s ease-out}
.screen.on{display:block}.screen.vis{opacity:1}
.el{position:absolute}
.tx{white-space:normal;overflow-wrap:break-word}
.hot{position:absolute;background:transparent;border:0;cursor:pointer;border-radius:10px;-webkit-tap-highlight-color:transparent}
.flash .hot{background:rgba(66,133,244,.28);outline:2px solid rgba(66,133,244,.6)}
.fld{position:absolute;border:1.5px solid #ece8f8;background:#fff;border-radius:16px;padding:0 18px;font:400 16px Inter,system-ui,sans-serif;color:#1e1846;outline:none}
.fld::placeholder{color:#7c7799;opacity:1}.fld:focus{border-color:#6c4cf5;box-shadow:0 0 0 3px rgba(108,76,245,.15)}
.fld.err{border-color:#ff5c8a;box-shadow:0 0 0 3px rgba(255,92,138,.18)}
.hint{font-size:13px;color:var(--mute);text-align:center;max-width:390px}
.hint b{color:var(--ink);font-weight:600}
@media (max-width:440px){body{padding:0;justify-content:flex-start}.device{border:0;border-radius:0;box-shadow:none}.hint{display:none}}
</style></head>

function render(el,els,live){
 for(const e of els){
  if(e.t==='rect'||e.t==='ellipse'){const d=document.createElement('div');d.className='el';
   Object.assign(d.style,{left:e.x+'px',top:e.y+'px',width:e.w+'px',height:e.h+'px',background:bgOf(e),borderRadius:e.t==='ellipse'?'50%':(e.r||0)+'px',opacity:e.op==null?1:e.op});
   if(e.stroke)d.style.boxShadow='inset 0 0 0 '+(e.sw||1)+'px '+e.stroke;if(e.k)d.dataset.k=e.k;el.appendChild(d)}
  else if(e.t==='input'&&!live){const d=document.createElement('div');d.className='fld';d.textContent=e.ph;Object.assign(d.style,{left:e.x+'px',top:e.y+'px',width:e.w+'px',height:e.h+'px',color:'#7c7799',lineHeight:(e.h-3)+'px'});el.appendChild(d)}
  else if(e.t==='thumb'){const w=document.createElement('div');w.className='el';Object.assign(w.style,{left:e.x+'px',top:e.y+'px',width:e.w+'px',height:e.h+'px',overflow:'hidden',borderRadius:(e.r||0)+'px',background:'#f5f2ff'});
   const inner=document.createElement('div');Object.assign(inner.style,{position:'absolute',left:0,top:0,width:W+'px',height:H+'px',transform:'scale('+e.scale+')',transformOrigin:'0 0'});render(inner,S[e.of].els,false);w.appendChild(inner);el.appendChild(w)}
  else if(e.t==='input'){const i=document.createElement('input');i.className='fld';i.id='f-'+e.id;i.placeholder=e.ph;i.autocomplete='off';
   if(e.mode==='decimal')i.inputMode='decimal';Object.assign(i.style,{left:e.x+'px',top:e.y+'px',width:e.w+'px',height:e.h+'px'});
   i.addEventListener('click',ev=>ev.stopPropagation());i.addEventListener('input',()=>i.classList.remove('err'));
   i.addEventListener('keydown',ev=>{if(ev.key==='Enter')check()});el.appendChild(i)}
  else if(e.t==='arc'){const s=document.createElementNS(svgNS,'svg');s.setAttribute('class','el');s.setAttribute('width',W);s.setAttribute('height',H);s.style.left=0;s.style.top=0;
   const p=document.createElementNS(svgNS,'path');p.setAttribute('d',arcPath(e.cx,e.cy,e.r,e.inner,e.a0,e.a1));p.setAttribute('fill',e.fill);s.appendChild(p);el.appendChild(s)}
  else if(e.t==='text'){const d=document.createElement('div');d.className='el tx';d.textContent=e.s;
   Object.assign(d.style,{left:e.x+'px',top:e.y+'px',width:e.w+'px',fontSize:e.size+'px',fontFamily:fam[e.f],fontWeight:e.wt,color:e.c,textAlign:e.al,lineHeight:(e.size*e.lh)+'px',opacity:e.op==null?1:e.op});if(e.k)d.dataset.k=e.k;el.appendChild(d)}
 }
 if(!live)return;
 for(const e of els){ if(e.t!=='link')continue;
  const b=document.createElement('button');b.className='hot';b.setAttribute('aria-label','Go to '+S[e.to].name);
  Object.assign(b.style,{left:e.x+'px',top:e.y+'px',width:e.w+'px',height:e.h+'px'});
  b.addEventListener('click',ev=>{ev.stopPropagation();if(e.act==='check'){check();return}if(e.act==='go'||e.act==='skip')log(e.act);go(e.to)});el.appendChild(b)}
}
for(const id in S){const el=document.createElement('div');el.className='screen';el.id='s-'+id;dev.appendChild(el);render(el,S[id].els,true)}
// ----- "Can I afford this?" logic (all money in cents) -----
const SAFE=2410, LEFT=12050, DAYS=4;
const money=c=>'$'+(c/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function parseAmount(raw){let s=String(raw).replace(/[^\d.,]/g,'');
 if(/^\d+,\d{1,2}$/.test(s))s=s.replace(',','.');else s=s.replace(/,/g,'');
 const v=parseFloat(s);return isFinite(v)&&v>0?Math.round(v*100):null}
function answer(a){
 if(a<=SAFE)return{state:'fits',verdict:'Yes, it fits today.',
  cost:'Left today: '+money(SAFE)+' → '+money(SAFE-a)+'. Your next 4 days stay at '+money(SAFE)+' a day.',
  goal:'Spring Break fund: still on track.'};
 if(a<=LEFT)return{state:'later',verdict:'Yes, but it costs you later.',
  cost:'Your next 4 days: '+money(SAFE)+' → '+money(Math.round((LEFT-a)/DAYS))+' a day.',
  goal:'Spring Break fund: still on track.'};
 return{state:'over',verdict:'Not before Nov 1.',
  cost:'It goes '+money(a-LEFT)+' over the '+money(LEFT)+' you have until then.',
  goal:'Spring Break fund: off track if you dip into it.'}}
const LOOK={fits:{c:'#0f8f6b',bg:'rgba(34,199,154,.14)'},later:{c:'#6c4cf5',bg:'#efeaff'},over:{c:'#d6336c',bg:'rgba(255,111,163,.16)'}};
window.FF={answer,parseAmount,money,log:[]};
function log(choice){const it=document.getElementById('s-o1b').querySelector('[data-k=item]').textContent;FF.log.push({choice,purchase:it,at:new Date().toISOString()});try{console.log('[Finfriend] '+choice+' · '+it)}catch(_){}}
function check(){const fa=document.getElementById('f-amount'),fi=document.getElementById('f-item');
 const a=parseAmount(fa.value);if(a==null){fa.classList.add('err');fa.focus();return}
 const r=answer(a),scr=document.getElementById('s-o1b'),q=k=>scr.querySelector('[data-k='+k+']');
 q('item').textContent=(fi.value.trim()||'This purchase')+' · '+money(a);
 q('verdict').textContent=r.verdict;q('verdict').style.color=LOOK[r.state].c;q('vcard').style.background=LOOK[r.state].bg;
 q('cost').textContent=r.cost;q('goal').textContent=r.goal;
 fa.blur();fi.blur();go('o1b')}
let cur=null;
function go(id){if(cur){cur.classList.remove('vis','on')}cur=document.getElementById('s-'+id);cur.classList.add('on');requestAnimationFrame(()=>requestAnimationFrame(()=>cur.classList.add('vis')))}
dev.addEventListener('click',()=>{dev.classList.add('flash');setTimeout(()=>dev.classList.remove('flash'),450)});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='r'||e.key==='R'){document.querySelectorAll('.fld').forEach(f=>{f.value='';f.classList.remove('err')});go('start')}});
function fit(){const vw=innerWidth,vh=innerHeight;if(vw<=440){dev.style.transform='scale('+(vw/390)+')';dev.style.marginBottom=(844*(vw/390)-844)+'px';return}
 const s=Math.min(1,(vh-70)/864);dev.style.transform='scale('+s+')';dev.style.marginBottom=(864*s-864)+'px'}
addEventListener('resize',fit);fit();
go(location.hash.slice(1)&&S[location.hash.slice(1)]?location.hash.slice(1):'start');
</script></body></html>
